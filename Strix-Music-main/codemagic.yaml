workflows:
  android-workflow:
    name: Strix Music APK Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build Strix Music APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - "*/build/outputs/apk//.apk"
