name: Build Strix Music APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: strix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Strix Music APK
        env:
          BLAZIFY_APPLICATION_ID: com.strix.music
          BLAZIFY_APP_NAME: Strix Music
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g -XX:+UseParallelGC" --stacktrace assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Strix-Music-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

